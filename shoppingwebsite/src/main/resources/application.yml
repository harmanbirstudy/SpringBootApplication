spring:
  resources:
    static-locations: classpath:/static/
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shoppingwebsite}
    username: ${DB_USERNAME:shopping}
    password: ${DB_PASSWORD:shopping}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQL10Dialect
  security:
    oauth2:
      client:
        registration:
          google:
            clientId: ${GOOGLE_CLIENT_ID}
            clientSecret: ${GOOGLE_CLIENT_SECRET}
            redirectUri: "{baseUrl}/oauth2/callback/{registrationId}"
            scope:
              - email
              - profile
app:
  auth:
    tokenSecret: ${APP_TOKEN_SECRET}
    tokenExpirationMsec: 864000000
  cors:
    allowedOrigins: http://localhost:4200 # Comma separated list of allowed origins
  oauth2:
    # After successfully authenticating with the OAuth2 Provider,
    # we'll be generating an auth token for the user and sending the token to the
    # redirectUri mentioned by the client in the /oauth2/authorize request.
    # We're not using cookies because they won't work well in mobile clients.
    authorizedRedirectUris:
#      - http://localhost:4200/login
#      - http://localhost:8080/login
logging:
  level:
    root: INFO
    # Set to DEBUG to see request-level details (cart/order lookups, JWT auth per request)
    com.webapp.shoppingwebsite: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
