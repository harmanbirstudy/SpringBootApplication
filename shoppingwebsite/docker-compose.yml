services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shoppingwebsite
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: shopping
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping -d shoppingwebsite"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The Spring Boot app, built from ./Dockerfile. Secrets come from .env next to this file
  # (Compose reads it automatically), see README "Secrets".
  #   docker compose up -d --build     # app + database
  #   docker compose up -d postgres    # database only (run the app from IntelliJ/mvn)
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/shoppingwebsite
      DB_USERNAME: shopping
      DB_PASSWORD: shopping
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      APP_TOKEN_SECRET: ${APP_TOKEN_SECRET}
    ports:
      - "8080:8080"

  # Runs scripts/seed.sql and exits — only when started with the "seed" profile:
  #   docker compose --profile seed up -d
  # seed.sql is idempotent (CREATE TABLE IF NOT EXISTS + ON CONFLICT DO NOTHING),
  # so re-running only fills in missing seed rows and never touches other data.
  seed:
    image: postgres:16
    profiles: ["seed"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: shopping
    volumes:
      - ./scripts/seed.sql:/seed.sql:ro
    command: ["psql", "-h", "postgres", "-U", "shopping", "-d", "shoppingwebsite", "-q", "-f", "/seed.sql"]
    restart: "no"

volumes:
  # Fixed name so other projects can share this database. DataSqlAnalysis mounts
  # the same volume for its optional Postgres; port 5432 ensures only one runs.
  pgdata:
    name: shoppingwebsite_pgdata
